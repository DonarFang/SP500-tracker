name: Engine Forward Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: engine-forward-daily
  cancel-in-progress: false

jobs:
  engine-forward:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install yfinance pandas numpy

      - name: Update Engine Forward prices
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/update_engine_forward_prices.py

      - name: Run Engine Forward daily
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/run_engine_forward_daily.py

      - name: Enforce Engine-only changes
        run: |
          git diff --name-only | tee /tmp/engine_changed.txt

          if grep -E \
            '^(data/prices/|data/oos/|exports/oos_|exports/e1r_v0_2_|dashboard/|public/)' \
            /tmp/engine_changed.txt
          then
            echo "Forbidden Legacy or Dashboard path changed"
            exit 1
          fi

          git diff --exit-code -- ".github/workflows/update.yml"

      - name: Stage Engine Forward input and output only
        run: |
          git add -f data/fw_prices/
          git add -f \
            "exports/official/FD-M3180125-SP500-TOP3-engine/forward/runtime/"
          git add -f \
            "exports/official/FD-M3180125-SP500-TOP3-engine/forward/automation/"

          git diff --cached --name-only \
            | tee /tmp/engine_staged.txt

          if grep -Ev \
            '^(data/fw_prices/|exports/official/FD-M3180125-SP500-TOP3-engine/forward/(runtime|automation)/)' \
            /tmp/engine_staged.txt
          then
            echo "Path outside Engine Forward staged"
            exit 1
          fi

          git diff --cached --check

      - name: Commit Engine Forward daily update
        run: |
          if git diff --cached --quiet; then
            echo "No Engine Forward changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Engine Forward daily"
          git pull --rebase origin main
          git push origin HEAD:main
