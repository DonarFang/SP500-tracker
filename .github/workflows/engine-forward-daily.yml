name: Engine Forward Daily

on:
  workflow_dispatch:
  schedule:
    # Primary run: 23:30 UTC Mon-Fri.
    - cron: '30 23 * * 1-5'
    # Same-session automatic recovery at +2h, +4h and +8h.
    - cron: '30 1,3,7 * * 2-6'

permissions:
  contents: write

concurrency:
  group: fd-m3180125-production-main-writer
  cancel-in-progress: false

jobs:
  engine-forward:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install yfinance pandas numpy

      - name: Resolve latest completed US market session
        id: latest_session
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          latest="$(python scripts/resolve_fd_m3180125_latest_completed_session.py)"
          echo "date=$latest" >> "$GITHUB_OUTPUT"
          echo "latest_completed_market_session=$latest"

      - name: Check Engine Forward session completion
        id: completion
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          complete="$(
            python scripts/check_fd_m3180125_track_session_complete.py \
              --track forward \
              --market-date "${{ steps.latest_session.outputs.date }}"
          )"
          test "$complete" = "true" || test "$complete" = "false"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "engine_forward_session_complete=$complete"

      - name: Update Engine Forward prices
        if: steps.completion.outputs.complete != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python scripts/update_engine_forward_prices.py \
            --expected-latest-market-date \
            "${{ steps.latest_session.outputs.date }}"

      - name: Run Engine Forward daily
        if: steps.completion.outputs.complete != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/run_engine_forward_daily.py

      - name: Enforce Engine-only changes
        run: |
          git diff --name-only | tee /tmp/engine_changed.txt

          if grep -E \
            '^(data/prices/|data/oos/|exports/oos_|exports/e1r_v0_2_|dashboard/|public/)' \
            /tmp/engine_changed.txt
          then
            echo "Forbidden Legacy or Dashboard path changed"
            exit 1
          fi

          git diff --exit-code -- ".github/workflows/update.yml"

      - name: Stage Engine Forward input and output only
        run: |
          git add -f data/fw_prices/
          git add -f data/fw_universe/state/ data/fw_universe/snapshots/
          git add -f \
            "exports/official/FD-M3180125-SP500-TOP3-engine/forward/runtime/"
          git add -f \
            "exports/official/FD-M3180125-SP500-TOP3-engine/forward/automation/"

          git diff --cached --name-only \
            | tee /tmp/engine_staged.txt

          if grep -Ev \
            '^(data/fw_prices/|data/fw_universe/(state|snapshots)/|exports/official/FD-M3180125-SP500-TOP3-engine/forward/(runtime|automation)/)' \
            /tmp/engine_staged.txt
          then
            echo "Path outside Engine Forward staged"
            exit 1
          fi

          git diff --cached --check

      - name: Commit Engine Forward daily update
        run: |
          if git diff --cached --quiet; then
            echo "No Engine Forward changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Engine Forward daily"
          for attempt in $(seq 1 8); do
            echo "Push attempt $attempt/8"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
              test "$remote_head" = "$(git rev-parse HEAD)"
              echo "PASS_ENGINE_FORWARD_DAILY_PERSISTED"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "HOLD_ENGINE_FORWARD_DAILY_PERSISTENCE"
          exit 1
