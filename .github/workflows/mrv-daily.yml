name: MRV Daily Observation
on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'
    - cron: '15 2,6 * * 2-6'
permissions:
  contents: write
concurrency:
  group: fd-m3180125-production-main-writer
  cancel-in-progress: false
jobs:
  mrv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen inference
        run: python3 scripts/mrv/run.py --self-test
      - name: Compute and archive
        id: compute
        continue-on-error: true
        run: python3 scripts/mrv/run.py --report-root "$RUNNER_TEMP/mrv-evidence"
      - name: Commit only MRV observations
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- exports/mrv
          if [ -d data/mrv ]; then git add -f -- data/mrv; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MRV: daily observation and source evidence'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrv-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mrv-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Report blocked computation
        if: steps.compute.outcome == 'failure'
        run: exit 1
