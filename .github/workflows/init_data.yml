name: 初始化历史数据（一次性）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 拉取2年历史数据
        run: python init_data.py
      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ exports/
          git diff --cached --quiet && echo "无变化" || (
            git commit -m "🗄️ 初始化历史数据：$(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')"
            git push
          )
