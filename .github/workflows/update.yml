name: 每日更新 S&P 500 数据

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 18:00 ET 夏令时
    - cron: '0 23 * * 1-5'   # 18:00 ET 冬令时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 增量更新 + 信号计算
        run: python fetch_data.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ exports/
          git diff --cached --quiet && echo "数据无变化" || (
            git commit -m "📊 自动更新：$(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')"
            git push
          )
