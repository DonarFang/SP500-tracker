name: 每日更新 S&P 500 数据

on:
  schedule:
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: 增量更新 + 信号计算
        run: python fetch_data.py
        python3 scripts/run_e1r_v0_2_oos.py

      - name: OOS 数据日期预检
        id: oos_check
        run: |
          python run_oos.py --check
          echo "check_passed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: OOS Tracking Engine
        if: steps.oos_check.outputs.check_passed == 'true'
        run: python run_oos.py
        continue-on-error: true  # OOS 失败不阻塞数据发布

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ exports/ data/rank_history/ data/oos/
          git diff --cached --quiet && echo "数据无变化" || (
            git commit -m "📊 自动更新：$(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')"
            git push
          )
