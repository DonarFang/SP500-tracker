name: DB-step-2 Public Live Monitor
on:
  schedule:
    # Taiwan 08:45, 10:45, 12:45, 16:45, 20:45, Tue-Sat.
    - cron: '45 0,2,4,8,12 * * 2-6'
  workflow_dispatch:
  workflow_run:
    workflows: ['Personal Live Track Daily', '部署 GitHub Pages']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: fd-m3180125-db-step2-monitor
  cancel-in-progress: false
jobs:
  verify-public:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Personal Live Track Daily' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public page and Live artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/db_step2_monitor.py --notify --event-file "$GITHUB_EVENT_PATH"
      - name: Preserve independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-step2-public-${{ github.run_id }}
          path: db-step2-monitor.json
          if-no-files-found: error
          retention-days: 30
