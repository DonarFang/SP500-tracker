name: Personal Live Track Daily

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-track-daily.yml'
      - 'docs/contracts/FD-M3180125_PARITY_REPAIR_CONTRACT_v1.0.md'
      - 'scripts/build_fd_m3180125_live_adjusted_shadow.py'
      - 'scripts/record_fd_m3180125_live_interaction.py'
      - 'scripts/run_fd_m3180125_live_daily.py'
      - 'scripts/update_fd_m3180125_live_prices.py'
      - 'src/e1r_engine/canonical_runtime.py'
      - 'src/e1r_engine/live_account_adapter.py'
      - 'src/e1r_engine/live_composition.py'
      - 'src/e1r_engine/live_cycle_state.py'
      - 'src/e1r_engine/live_ledger.py'
  workflow_dispatch:
    inputs:
      parity_shadow_only:
        description: Build adjusted-price Parity shadow without running Live
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: personal-live-track-daily
  cancel-in-progress: false

jobs:
  personal-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install yfinance pandas numpy
      - name: Update independent Personal Live prices
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only != true)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          EXPECTED_LATEST_MARKET_DATE="$(
            TZ=America/New_York date +%F
          )"
          echo "expected_latest_market_date=$EXPECTED_LATEST_MARKET_DATE"
          python scripts/update_fd_m3180125_live_prices.py \
            --expected-latest-market-date \
            "$EXPECTED_LATEST_MARKET_DATE"
      - name: Run ACTIVE Personal Live daily
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only != true)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/run_fd_m3180125_live_daily.py
      - name: Build adjusted Live price shadow only
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only == true)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          EXPECTED_LATEST_MARKET_DATE="$(TZ=America/New_York date +%F)"
          python scripts/build_fd_m3180125_live_adjusted_shadow.py \
            --end-date "$EXPECTED_LATEST_MARKET_DATE"
      - name: Enforce Live-only isolation
        run: |
          git diff --name-only | tee /tmp/live_changed.txt
          if grep -E '^(data/fw_prices/|data/prices/|data/oos/|exports/oos_|exports/e1r_v0_2_|exports/official/FD-M3180125-SP500-TOP3-engine/(forward|backtest)/|dashboard/|public/)' /tmp/live_changed.txt; then
            echo "Forbidden non-Live path changed"; exit 1
          fi
          git diff --exit-code -- ".github/workflows/update.yml" ".github/workflows/engine-forward-daily.yml"
      - name: Stage Personal Live input and output only
        run: |
          git add -f data/live_prices/
          git add -f data/live_prices_adjusted_v1/
          git add -f "exports/official/FD-M3180125-SP500-TOP3-engine/live/runtime/"
          git add -f "exports/official/FD-M3180125-SP500-TOP3-engine/live/automation/"
          git diff --cached --name-only | tee /tmp/live_staged.txt
          if grep -Ev '^(data/live_prices/|data/live_prices_adjusted_v1/|exports/official/FD-M3180125-SP500-TOP3-engine/live/(runtime|automation)/)' /tmp/live_staged.txt; then
            echo "Path outside Personal Live staged"; exit 1
          fi
          git diff --cached --check
      - name: Commit Personal Live daily update
        run: |
          if git diff --cached --quiet; then echo "No Personal Live changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Personal Live daily"
          git pull --rebase origin main
          git push origin HEAD:main
