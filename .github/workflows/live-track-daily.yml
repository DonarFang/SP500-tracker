name: Personal Live Track Daily

on:
  # github.event_name == 'push' is validation-only; it never updates accepted
  # prices and never runs ACTIVE Live.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-track-daily.yml'
      - 'docs/contracts/FD-M3180125_PARITY_REPAIR_CONTRACT_v1.0.md'
      - 'scripts/build_fd_m3180125_live_adjusted_shadow.py'
      - 'scripts/update_fd_m3180125_live_adjusted_prices.py'
      - 'scripts/record_fd_m3180125_live_interaction.py'
      - 'scripts/run_fd_m3180125_live_daily.py'
      - 'scripts/update_fd_m3180125_live_prices.py'
      - 'src/e1r_engine/canonical_runtime.py'
      - 'src/e1r_engine/live_account_adapter.py'
      - 'src/e1r_engine/live_composition.py'
      - 'src/e1r_engine/live_cycle_state.py'
      - 'src/e1r_engine/live_ledger.py'
  workflow_dispatch:
    inputs:
      parity_shadow_only:
        description: Build adjusted-price Parity shadow without running Live
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: fd-m3180125-production-main-writer
  cancel-in-progress: false

jobs:
  personal-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install yfinance pandas numpy
      - name: Resolve latest completed US market session
        id: latest_session
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only != true)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          latest="$(python scripts/resolve_fd_m3180125_latest_completed_session.py)"
          echo "date=$latest" >> "$GITHUB_OUTPUT"
          echo "latest_completed_market_session=$latest"

      - name: Build accepted adjusted Personal Live prices
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only != true)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python scripts/update_fd_m3180125_live_adjusted_prices.py \
            --expected-latest-market-date \
            "${{ steps.latest_session.outputs.date }}"
      - name: Run ACTIVE Personal Live daily
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only != true)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          FD_M3180125_LIVE_PRICE_MODE: ADJUSTED_ACCEPTED
        run: python scripts/run_fd_m3180125_live_daily.py
      - name: Build adjusted Live price shadow only
        id: adjusted_shadow
        if: github.event_name == 'workflow_dispatch' && inputs.parity_shadow_only == true
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set +e
          python scripts/build_fd_m3180125_live_adjusted_shadow.py \
            --shadow-root data/live_prices_adjusted_shadow_v1/live_prices \
            --as-of-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            2>&1 | tee /tmp/parity_step_2_adjusted_shadow.log
          build_status=${PIPESTATUS[0]}
          echo "exit_code=$build_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve adjusted Shadow evidence
        if: always() && steps.adjusted_shadow.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: parity-step-2-adjusted-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/parity_step_2_adjusted_shadow.log
            exports/official/FD-M3180125-SP500-TOP3-engine/live/automation/parity/current_adjusted_shadow.json
      - name: Enforce adjusted Shadow result
        if: steps.adjusted_shadow.outcome != 'skipped'
        run: |
          test "${{ steps.adjusted_shadow.outputs.exit_code }}" = "0"
      - name: Enforce Live-only isolation
        run: |
          git diff --name-only | tee /tmp/live_changed.txt
          if grep -E '^(data/fw_prices/|data/live_prices/|data/prices/|data/oos/|exports/oos_|exports/e1r_v0_2_|exports/official/FD-M3180125-SP500-TOP3-engine/(forward|backtest)/|dashboard/|public/)' /tmp/live_changed.txt; then
            echo "Forbidden non-Live path changed"; exit 1
          fi
          git diff --exit-code -- ".github/workflows/update.yml" ".github/workflows/engine-forward-daily.yml"
      - name: Stage Personal Live input and output only
        run: |
          git add -f data/live_prices_adjusted_v1/
          git add -f data/live_universe/state/ data/live_universe/snapshots/
          git add -f "exports/official/FD-M3180125-SP500-TOP3-engine/live/runtime/"
          git add -f "exports/official/FD-M3180125-SP500-TOP3-engine/live/automation/"
          git diff --cached --name-only | tee /tmp/live_staged.txt
          if grep -Ev '^(data/live_prices_adjusted_v1/|data/live_universe/(state|snapshots)/|exports/official/FD-M3180125-SP500-TOP3-engine/live/(runtime|automation)/)' /tmp/live_staged.txt; then
            echo "Path outside Personal Live staged"; exit 1
          fi
          git diff --cached --check
      - name: Commit Personal Live daily update
        run: |
          if git diff --cached --quiet; then echo "No Personal Live changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Personal Live daily"
          for attempt in $(seq 1 8); do
            echo "Push attempt $attempt/8"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
              test "$remote_head" = "$(git rev-parse HEAD)"
              echo "PASS_PERSONAL_LIVE_DAILY_PERSISTED"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "HOLD_PERSONAL_LIVE_DAILY_PERSISTENCE"
          exit 1
