<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP500 Trend Decision Support Cockpit</title>
<link rel="stylesheet" href="styles.css?v=stage38e2b-v3-c1a7e46">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
.badge-hold{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:#F1EFE8;color:#2C2C2A}
.badge-exit{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:#FCEBEB;color:#501313}
.badge-sim {display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:#EEEDFE;color:#26215C}
.frozen-banner{background:rgba(29,158,117,0.08);border-left:3px solid #1D9E75;padding:8px 14px;border-radius:0 6px 6px 0;font-size:12px;margin-bottom:12px;line-height:1.6}
.oos-banner{background:rgba(239,159,39,0.08);border-left:3px solid #EF9F27;padding:8px 14px;border-radius:0 6px 6px 0;font-size:12px;margin-bottom:12px;line-height:1.6}
.arch-banner{background:rgba(136,135,128,0.08);border-left:3px solid #888;padding:8px 14px;border-radius:0 6px 6px 0;font-size:12px;margin-bottom:12px;line-height:1.6}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div>
      <h1>📈 SP500 Trend Decision Support Cockpit</h1>
      <p>Swing Trend Following · 持仓周期 1–3周 · Yahoo Finance · 每交易日 18:00 ET 自动更新</p>
      <div class="live-badge"><span class="dot"></span><span id="uptime">加载中...</span></div>
    </div>
    <button class="btn-refresh" onclick="loadAll()">↻ 刷新</button>
  </div>
  <div class="tabs">
    <button class="tab on"  onclick="go('market',   this)">🌐 Market Overview</button>
    <button class="tab"     onclick="go('leader',   this)">🏆 Leader Board</button>
    <button class="tab"     onclick="go('watchlist',this)">👁 Watchlist</button>
    <button class="tab"     onclick="go('positions',this)">📊 Positions &amp; Exit</button>
    <button class="tab"     onclick="go('research', this)">🔬 Research &amp; Backtest</button>
  </div>
  <div id="s-market"    class="section on"><div class="loading"><span class="spin"></span>加载数据中...</div></div>
  <div id="s-leader"    class="section"><div class="loading"><span class="spin"></span>加载数据中...</div></div>
  <div id="s-watchlist" class="section"><div class="loading"><span class="spin"></span>加载数据中...</div></div>
  <div id="s-positions" class="section"><div class="loading"><span class="spin"></span>加载数据中...</div></div>
  <div id="s-research"  class="section"><div class="loading"><span class="spin"></span>加载数据中...</div></div>
</div>
<script src="app.js?v=stage38e2b-v3-c1a7e46"></script>
</body>
</html>
